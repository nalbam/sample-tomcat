# Prometheus JMX exporter 1.7.0, Java agent mode.
# https://github.com/prometheus/jmx_exporter/blob/1.7.0/website/docs/reference/configuration.md
# The agent reads the MBeans of its own JVM. Remote JMX keys (hostPort, jmxUrl, username, password, ssl)
# only apply to the standalone exporter, so they are not set here.
---
# startDelaySeconds: 0
lowercaseOutputName: true
lowercaseOutputLabelNames: true
# includeObjectNames: ["Catalina:*"]
# excludeObjectNames: ["Catalina:type=RequestProcessor,*"]
rules:
