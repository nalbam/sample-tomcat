name: build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_call:

permissions:
  contents: read

# Called from release.yml, github.workflow is the caller's name, so this group
# never matches the release group.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      IMAGE: ${{ github.event.repository.name }}:ci-${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Run Build
        run: |
          ./build.sh

      - name: Build Docker Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE }}

      - name: Smoke Test Docker Image
        run: |
          docker run --name smoke -p 8080:8080 -d "${IMAGE}"
          for _ in $(seq 1 30); do
            if curl -fs http://localhost:8080/live; then
              exec ./scripts/smoke.sh http://localhost:8080
            fi
            sleep 2
          done
          docker logs smoke
          exit 1

      # Tag runs hand the tested WAR to the release image job.
      - name: Upload WAR (tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: war-${{ github.sha }}
          path: target/*.war
          if-no-files-found: error
          retention-days: 7
